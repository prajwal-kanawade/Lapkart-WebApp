{% extends "Laptop/layout.html" %}

{% block title %}
<title>Delete Laptop - LapKart</title>
{% endblock title %}

{% block main_content %}
<div class="shell-card mx-auto text-center" style="max-width: 480px;">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
    <h4 class="mt-3">Delete "{{ laptop.display_name }}"?</h4>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'manage_products' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock main_content %}
